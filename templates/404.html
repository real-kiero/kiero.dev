{% extends "base.html" %}

{% block title %}404 - {{ config.title }}{% endblock title %}
{% block description %}Page not found{% endblock description %}

{% block content %}
<div class="not-found">
  <h1>Page not found</h1>
  <p>That page doesn't exist or has been moved.</p>
  <p><a href="{{ get_url(path='/') | safe }}">Go home</a></p>
</div>
{% endblock content %}
